# Full stack: PostgreSQL, the Django API and the Next.js site.
# Expects the web repo checked out next to this one, as ../cladasafari-web.
#
#   cp .env.docker.example .env.docker   # then fill in the secrets
#   docker compose --env-file .env.docker up --build
#   docker compose --env-file .env.docker exec api python manage.py seed
#
# Site: http://localhost:3001   API: http://localhost:8001   Django admin: /django-admin/
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cladasafari
      POSTGRES_USER: cladasafari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cladasafari}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cladasafari"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.docker}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.docker}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgresql://cladasafari:${POSTGRES_PASSWORD:-cladasafari}@db:5432/cladasafari
      WEB_ORIGIN: http://localhost:3001
      PUBLIC_API_URL: http://localhost:8001
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env.docker}
      REVALIDATE_URL: http://web:3000/api/revalidate
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cladasafaribliss.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"

  web:
    build:
      context: ../cladasafari-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
